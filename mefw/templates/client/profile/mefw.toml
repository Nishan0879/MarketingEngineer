# Machine-readable settings for this client. The human-readable profile is
# business-profile.md next to this file; keep the two in step.

[client]
id = "{client_id}"
name = ""                     # shown on the client report; defaults to the id
timezone = "UTC"

# The one business outcome marketing is judged on (Section 14.1), counted
# weekly in the cockpit memo. metric: "commits" (number won) or "commit_value".
[north_star]
label = "Commitments"
metric = "commits"

[funnel]
# Typical days from inquiry to commitment. Leads older than this should have a
# won/lost outcome reported (Section 7).
cycle_days = 30

# Map the client's own stage names (as they appear in their lead-tracking
# tool) onto the universal funnel. Matching ignores case.
[funnel.stages]
inquire = ["New", "New Inquiry", "Lead"]
qualify = ["Qualified", "Contacted - Qualified"]
meet    = ["Tour Booked", "Tour Completed", "Consult", "Demo", "Meeting"]
commit  = ["Signed", "Won", "Closed Won"]
retain  = ["Renewed"]

# Optional: segments with their own funnel (Section 7), e.g. members vs. office
# tenants. A lead joins the segment whose `match` list contains its segment
# value from the lead-tracking tool. Each segment can set its own cycle length,
# extra stage names and audit thresholds. Without segments, all leads are one group.
#
# [segments.members]
# label = "Members (B2C)"
# match = ["Freelancer", "Remote employee", "Day pass"]
# cycle_days = 21
#
# [segments.offices]
# label = "Office leases (B2B)"
# match = ["Small team", "Company", "Office lease"]
# cycle_days = 90
# [segments.offices.stages]
# meet = ["Site Visit", "Proposal Sent", "Negotiation"]
# [segments.offices.cold_audit]
# cold_after_days = 30
# min_followups = 5

# Agents allowed to run for this client. An agent with no spec file does not run.
[agents.cold-inquiry-auditor]
engine = "conversion"
level = 0                     # 0 observe, 1 draft, 2 act within a playbook, 3 act with a budget
spec = "agents/cold-inquiry-auditor.md"
max_actions_per_day = 5
max_consecutive_errors = 2    # after this many failures in a row the agent is paused

[agents.customer-truth-analyst]
engine = "core"
level = 0
spec = "agents/customer-truth-analyst.md"
max_actions_per_day = 5
max_consecutive_errors = 2

[agents.experiment-tracker]
engine = "core"
level = 0
spec = "agents/experiment-tracker.md"
max_actions_per_day = 20

[agents.growth-cockpit]
engine = "core"
level = 0
spec = "agents/growth-cockpit.md"
max_actions_per_day = 5

[agents.client-reporter]
engine = "core"
level = 0                     # drafts the report; the operator approves before the client sees it
spec = "agents/client-reporter.md"
max_actions_per_day = 5

[agents.content-brief-writer]
engine = "content"
level = 1                     # writes briefs; a human writes, approves and publishes
spec = "agents/content-brief-writer.md"
max_actions_per_day = 10

[agents.first-response-drafter]
engine = "conversion"
level = 1                     # drafts only; a human approves and sends
spec = "agents/first-response-drafter.md"
max_actions_per_day = 50

[agents.re-engagement-drafter]
engine = "conversion"
level = 1                     # drafts only; a human approves and sends
spec = "agents/re-engagement-drafter.md"
max_actions_per_day = 25

# When jobs run on their own (Section 19, "Scheduled workflows"). Call
# `mefw run-due` every 15 minutes from cron, Task Scheduler or any runner; it
# runs whatever is due, in a safe order, through the same guardrails as running
# a command by hand. Times are in [client] timezone. Formats: "every 2h",
# "every 30m", "hourly", "daily 07:00", "weekly mon 07:00", "monthly 1 08:00"
# (day 1-28). Leave a job out to
# run it only by hand. `mefw schedule` shows last and next runs.
[schedule]
import                 = "every 2h"
first-response-drafter = "every 2h"
customer-truth-analyst = "daily 06:30"
content-brief-writer   = "weekly mon 06:40"
cold-inquiry-auditor   = "weekly mon 06:00"
re-engagement-drafter  = "weekly mon 06:15"
experiment-tracker     = "weekly mon 06:30"
quality-check          = "daily 06:45"
growth-cockpit         = "weekly mon 07:00"
client-reporter        = "monthly 1 08:00"

# Where the import job finds the client's exports, relative to this workspace.
# Drop fresh exports here (by hand, or with the lead tool's scheduled export).
# Unchanged files are skipped. inbox/ is gitignored: exports stay local.
[schedule.inbox]
leads      = "inbox/leads.csv"
activities = "inbox/activities.csv"   # optional
signals    = "inbox/signals.csv"      # optional

# Content engine (Section 9.1). A confirmed insight gets a brief once it has at
# least min_evidence signals behind it, and a fresh one at most every
# refresh_days. Links carry utm_campaign=<tag_prefix>-<insight>.
[content]
min_evidence = 5
refresh_days = 60
tag_prefix   = "mefw"

[conversion.cold_audit]
lookback_days = 180
cold_after_days = 14          # no activity for this long = cold
slow_response_hours = 24      # a first response slower than this counts as slow
min_followups = 3             # fewer outbound touches than this = gave up early
min_group_size = 10           # below this, comparisons say "not enough evidence"
response_buckets_minutes = [5, 60, 1440]
max_candidates = 25

# Customer truth (Section 8.2). Themes are what buyers talk about, found by
# keyword for now. Replace these generic ones with the client's own language.
[customer_truth]
period_days = 30          # "this period"
baseline_periods = 3      # compared against the average of this many periods before
min_mentions = 3          # fewer mentions than this is not a pattern
rising_factor = 1.5       # this period vs. baseline average to count as rising
min_group_size = 5        # won vs. lost comparison needs this many leads per side
quote_max_chars = 160

[customer_truth.themes.price]
label = "Price and budget"
keywords = ["price", "pricing", "expensive", "cost", "budget", "afford", "cheaper", "too much"]

[customer_truth.themes.timing]
label = "Timing"
keywords = ["not ready", "timing", "next quarter", "later this year", "too soon", "on hold"]

[customer_truth.themes.competitor]
label = "Chose or compared an alternative"
keywords = ["competitor", "went with", "chose another", "other option", "elsewhere", "compared"]

[customer_truth.themes.responsiveness]
label = "Speed and responsiveness"
keywords = ["no reply", "never heard back", "slow to respond", "quick response", "fast response", "followed up"]

[customer_truth.themes.flexibility]
label = "Flexible terms"
keywords = ["flexible", "month-to-month", "month to month", "short term", "no long-term", "lease length", "commitment"]

# CSV export of notes, messages or reviews. Map the columns your export has;
# `text` is scrubbed of emails and phone numbers on import.
[adapters.signals_csv]
source = "notes"

[adapters.signals_csv.columns]
kind     = "Type"
ref      = "Note ID"
at       = "Date"
text     = "Text"
lead_ref = "Lead ID"
segment  = "Segment"

[adapters.signals_csv.kind_values]
call_note       = ["call", "call note", "phone call"]
tour_note       = ["tour", "tour note", "site visit"]
inquiry_message = ["inquiry", "form", "message", "dm", "email"]
lost_note       = ["lost", "lost note"]
review          = ["review", "google review"]

# CSV export from the client's lead-tracking tool. Map only the columns listed
# below. Never map names, emails, phone numbers or other personal data: the
# importer refuses them, and they stay in the client's own tool.
[adapters.csv]
source = "crm"

[adapters.csv.columns]
ref               = "Lead ID"
inquired_at       = "Created At"
channel           = "Source"
segment           = "Segment"
value             = "Value"
first_response_at = "First Response At"
last_outbound_at  = "Last Outbound At"
last_inbound_at   = "Last Inbound At"
outbound_count    = "Outbound Count"
stage             = "Stage"
outcome           = "Status"
outcome_at        = "Closed At"
lost_reason       = "Lost Reason"
# opted_out       = "Do Not Contact"   # map this if the export has it; drafts skip opted-out leads
# campaign        = "UTM Campaign"     # map this to trace inquiries back to content

# Columns holding the date a stage was reached, keyed by the client's stage name.
[adapters.csv.stage_dates]
"Qualified"   = "Qualified At"
"Tour Booked" = "Tour Booked At"

[adapters.csv.outcome_values]
won  = ["Won", "Signed", "Closed Won"]
lost = ["Lost", "Closed Lost", "Dead"]

# Optional second export with one row per message or call.
[adapters.csv.activities]
ref = "Lead ID"
at = "Timestamp"
direction = "Direction"
out_values = ["out", "outbound", "sent"]
